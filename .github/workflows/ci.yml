name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify native optional dependencies
        run: |
          node -e "Promise.all([import('sharp'), import('@resvg/resvg-js')]).then(([sharp, resvg]) => { if (!sharp.default.versions.sharp || typeof resvg.Resvg !== 'function') process.exit(1) })"

      - run: pnpm run typecheck

      - run: pnpm test

      # 构建单独跑：declaration emit 会暴露 --noEmit 检查不出的问题，
      # 例如导出函数签名里引用了未导出的类型。
      - run: pnpm run build
