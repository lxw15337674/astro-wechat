name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # submodule 是部署产物的来源，构建和测试都不需要它。
        with:
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      # 构建单独跑：declaration emit 会暴露 --noEmit 检查不出的问题，
      # 例如导出函数签名里引用了未导出的类型。
      - run: pnpm run build
